services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qaa_tms}
      POSTGRES_USER: ${POSTGRES_USER:-qaa_tms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qaa_tms}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qaa_tms} -d ${POSTGRES_DB:-qaa_tms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qaa_tms}:${POSTGRES_PASSWORD:-qaa_tms}@db:5432/${POSTGRES_DB:-qaa_tms}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      QAA_GENERATOR_BASE_URL: ${QAA_GENERATOR_BASE_URL:-http://qaa-generator.default.svc.cluster.local:8080/api/v1}
      QAA_GENERATOR_SERVICE_TOKEN: ${QAA_GENERATOR_SERVICE_TOKEN:-}
      QAA_GENERATOR_SUPERUSER_TOKEN: ${QAA_GENERATOR_SUPERUSER_TOKEN:-}
      QAA_GENERATOR_ACTOR: ${QAA_GENERATOR_ACTOR:-}
      QAA_GENERATOR_PORT_FORWARD_ENABLED: ${QAA_GENERATOR_PORT_FORWARD_ENABLED:-false}
      QAA_GENERATOR_PORT_FORWARD_NAMESPACE: ${QAA_GENERATOR_PORT_FORWARD_NAMESPACE:-qaa-prod}
      QAA_GENERATOR_PORT_FORWARD_RESOURCE: ${QAA_GENERATOR_PORT_FORWARD_RESOURCE:-svc/qaa-generator}
      QAA_GENERATOR_PORT_FORWARD_LOCAL_PORT: ${QAA_GENERATOR_PORT_FORWARD_LOCAL_PORT:-18080}
      QAA_GENERATOR_PORT_FORWARD_REMOTE_PORT: ${QAA_GENERATOR_PORT_FORWARD_REMOTE_PORT:-8080}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
